<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بوتیک | فروشگاه آنلاین</title>
<meta name="description" content="فروشگاه اینترنتی تک‌صفحه‌ای با پوشاک، کیف و کفش، اکسسوری و لوازم خانه" />

<!-- فونت وزیرمتن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ===================== توکن‌های طراحی ===================== */
  :root{
    --bg:#F5F6F2;
    --surface:#FFFFFF;
    --ink:#17211A;
    --ink-soft:#5B6A5D;
    --pine:#0E4C40;
    --pine-d:#0A3A30;
    --pine-x:#0D6153;
    --brass:#C98F2B;
    --brass-l:#E7C07E;
    --cream:#EFEADC;
    --danger:#C0392B;
    --line:#E4E2D8;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-md:0 14px 34px -18px rgba(14,76,64,.35);
    --shadow-lg:0 24px 60px -20px rgba(14,76,64,.4);
    --header-h:74px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;text-decoration:none;}
  input, select, textarea{font-family:inherit;}
  ::selection{background:var(--brass-l);color:var(--pine-d);}

  .container{max-width:1240px;margin:0 auto;padding:0 20px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* focus قابل مشاهده برای دسترسی‌پذیری */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
    border-radius:6px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  /* ===================== هدر ===================== */
  header.site-header{
    position:sticky; top:0; z-index:50;
    background:rgba(245,246,242,.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    height:var(--header-h);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    flex:0 0 auto;
    font-weight:800; font-size:1.15rem; color:var(--pine-d);
    white-space:nowrap;
  }
  .brand img{width:40px;height:40px;border-radius:50%;}
  .brand span.tag{display:block;font-size:.7rem;font-weight:500;color:var(--ink-soft);}

  .search-wrap{
    flex:1 1 auto;
    position:relative;
    max-width:520px;
    margin:0 auto;
  }
  .search-wrap input{
    width:100%;
    padding:11px 44px 11px 16px;
    border:1.5px solid var(--line);
    border-radius:999px;
    background:var(--surface);
    font-size:.92rem;
    transition:border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus{
    border-color:var(--pine-x);
    box-shadow:0 0 0 4px rgba(14,97,83,.12);
    outline:none;
  }
  .search-wrap svg{
    position:absolute; right:15px; top:50%; transform:translateY(-50%);
    width:18px;height:18px;color:var(--ink-soft);
    pointer-events:none;
  }
  #searchResultsHint{
    position:absolute; inset-inline:0; top:110%;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:8px 14px; font-size:.8rem;
    color:var(--ink-soft); box-shadow:var(--shadow-md); display:none;
  }

  .cart-btn{
    flex:0 0 auto;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--pine);
    border:none;
    color:var(--cream);
    transition:transform .18s ease, background .2s;
  }
  .cart-btn:hover{background:var(--pine-x); transform:translateY(-2px);}
  .cart-btn svg{width:20px;height:20px;}
  .cart-badge{
    position:absolute; top:-6px; left:-6px;
    background:var(--brass);
    color:var(--pine-d);
    font-size:.68rem; font-weight:800;
    min-width:19px; height:19px; padding:0 4px;
    border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bg);
  }

  /* ===================== اسلایدر بنر ===================== */
  .hero-slider{
    position:relative;
    height:300px;
    overflow:hidden;
  }
  .hero-slide{
    position:absolute; inset:0;
    opacity:0; visibility:hidden;
    transition:opacity .9s ease;
  }
  .hero-slide.active{opacity:1; visibility:visible;}
  .hero-slide img{width:100%;height:100%;object-fit:cover;}
  .hero-dots{
    position:absolute; bottom:16px; right:50%; transform:translateX(50%);
    display:flex; gap:8px; z-index:2;
  }
  .hero-dots button{
    width:9px;height:9px;border-radius:50%;
    border:1.5px solid var(--cream);
    background:transparent;
    padding:0;
    transition:background .2s, width .2s;
  }
  .hero-dots button.active{background:var(--brass-l); border-color:var(--brass-l); width:22px; border-radius:6px;}

  /* ===================== بخش‌ها ===================== */
  section.section{padding:44px 0;}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:20px; gap:12px; flex-wrap:wrap;
  }
  .section-head h2{
    font-size:1.35rem; font-weight:800; margin:0; color:var(--pine-d);
    position:relative; padding-inline-start:14px;
  }
  .section-head h2::before{
    content:""; position:absolute; inline-size:5px; inset-inline-start:0; top:2px; bottom:2px;
    background:var(--brass); border-radius:4px;
  }
  .section-head .sub{font-size:.85rem;color:var(--ink-soft);}

  /* دسته‌بندی‌ها */
  .cat-row{
    display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;
    scrollbar-width:thin;
  }
  .cat-chip{
    flex:0 0 auto;
    padding:9px 18px;
    border-radius:999px;
    background:var(--surface);
    border:1.5px solid var(--line);
    font-size:.85rem; font-weight:600; color:var(--ink);
    transition:all .18s;
    white-space:nowrap;
  }
  .cat-chip:hover{border-color:var(--pine-x);}
  .cat-chip.active{background:var(--pine); border-color:var(--pine); color:var(--cream);}

  /* کارت محصول */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
  }
  .product-card{
    background:var(--surface);
    border-radius:var(--radius-lg);
    overflow:hidden;
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease;
    position:relative;
  }
  .product-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-md);}
  .product-thumb{
    position:relative;
    aspect-ratio:1/1;
    background:var(--cream);
    cursor:pointer;
    overflow:hidden;
  }
  .product-thumb img{width:100%;height:100%;object-fit:cover; transition:transform .5s ease;}
  .product-card:hover .product-thumb img{transform:scale(1.06);}
  .badge-ribbon{
    position:absolute; top:12px; right:-30px;
    background:var(--brass); color:var(--pine-d);
    font-size:.68rem; font-weight:800;
    padding:4px 34px;
    transform:rotate(45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .product-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .product-cat{font-size:.7rem; color:var(--pine-x); font-weight:700;}
  .product-name{
    font-size:.94rem; font-weight:700; margin:0; cursor:pointer;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .product-foot{
    margin-top:auto;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .price-chip{
    background:var(--cream); color:var(--pine-d);
    font-weight:800; font-size:.85rem;
    padding:5px 10px; border-radius:8px;
    white-space:nowrap;
  }
  .add-btn{
    width:38px;height:38px; border-radius:50%;
    border:none; background:var(--pine); color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    position:relative; overflow:hidden;
    transition:background .2s, transform .15s;
    flex:0 0 auto;
  }
  .add-btn:hover{background:var(--pine-x);}
  .add-btn:active{transform:scale(.92);}
  .add-btn svg{width:16px;height:16px;}

  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(239,234,220,.65);
    transform:scale(0); animation:ripple .55s ease-out;
    pointer-events:none;
  }
  @keyframes ripple{to{transform:scale(2.6); opacity:0;}}

  .load-more-wrap{display:flex;justify-content:center;margin-top:26px;}
  .btn-outline{
    padding:12px 28px; border-radius:999px;
    border:1.5px solid var(--pine); background:transparent; color:var(--pine-d);
    font-weight:700; font-size:.88rem;
    transition:all .2s;
  }
  .btn-outline:hover{background:var(--pine); color:var(--cream);}

  /* پرفروش‌ترین‌ها - ریل افقی */
  .rail{
    display:flex; gap:16px; overflow-x:auto; padding:6px 4px 16px;
    scroll-snap-type:x proximity;
    cursor:grab;
    user-select:none;
  }
  .rail.dragging{cursor:grabbing;}
  .rail .product-card{min-width:200px; scroll-snap-align:start;}
  .rail::-webkit-scrollbar{height:6px;}
  .rail::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  /* ===================== مودال جزئیات محصول ===================== */
  .overlay{
    position:fixed; inset:0; background:rgba(10,20,15,.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; opacity:0; visibility:hidden; transition:opacity .25s ease;
  }
  .overlay.open{opacity:1; visibility:visible;}
  @media (min-width:760px){
    .overlay{align-items:center;}
  }
  .modal{
    background:var(--surface);
    width:100%; max-width:840px;
    max-height:92vh; overflow-y:auto;
    border-radius:24px 24px 0 0;
    transform:translateY(30px);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    padding:0;
  }
  @media (min-width:760px){
    .modal{border-radius:24px;}
  }
  .overlay.open .modal{transform:translateY(0);}
  .modal-close{
    position:sticky; top:14px; float:left; margin-inline-start:14px;
    width:36px;height:36px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    z-index:5;
  }
  .modal-grid{display:grid; grid-template-columns:1fr; gap:0;}
  @media (min-width:640px){
    .modal-grid{grid-template-columns:1fr 1fr;}
  }
  .modal-img{background:var(--cream); aspect-ratio:1/1;}
  .modal-img img{width:100%;height:100%;object-fit:cover;}
  .modal-info{padding:24px 26px 30px; display:flex; flex-direction:column; gap:12px;}
  .modal-info h3{margin:0; font-size:1.3rem; font-weight:800; color:var(--pine-d);}
  .modal-price{font-size:1.4rem; font-weight:800; color:var(--brass); }
  .modal-desc{color:var(--ink-soft); font-size:.92rem;}
  .qty-row{display:flex; align-items:center; gap:12px; margin-top:6px;}
  .qty-control{
    display:flex; align-items:center; border:1.5px solid var(--line); border-radius:999px; overflow:hidden;
  }
  .qty-control button{
    width:36px;height:36px; border:none; background:var(--cream); font-weight:800; font-size:1.05rem;
  }
  .qty-control span{width:34px; text-align:center; font-weight:700;}
  .modal-add{
    padding:13px 22px; border:none; border-radius:999px; background:var(--pine); color:var(--cream);
    font-weight:800; font-size:.92rem; transition:background .2s;
  }
  .modal-add:hover{background:var(--pine-x);}
  .related-wrap{padding:0 26px 30px;}
  .related-wrap h4{font-size:.95rem; font-weight:800; color:var(--pine-d); margin:6px 0 12px;}
  .related-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .related-grid .product-card{font-size:.85rem;}

  /* ===================== سبد خرید ===================== */
  .cart-drawer{
    position:fixed; top:0; bottom:0; left:0;
    width:100%; max-width:400px;
    background:var(--surface);
    box-shadow:var(--shadow-lg);
    transform:translateX(-105%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    z-index:110;
    display:flex; flex-direction:column;
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{
    padding:18px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .cart-head h3{margin:0; font-size:1.05rem; font-weight:800; color:var(--pine-d);}
  .cart-items{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px;}
  .cart-item{display:flex; gap:12px; border-bottom:1px dashed var(--line); padding-bottom:12px;}
  .cart-item img{width:64px;height:64px;border-radius:10px;object-fit:cover; flex:0 0 auto; background:var(--cream);}
  .cart-item-info{flex:1; min-width:0;}
  .cart-item-info .name{font-size:.86rem; font-weight:700; margin:0 0 4px;}
  .cart-item-info .price{font-size:.78rem; color:var(--ink-soft);}
  .cart-item-actions{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .cart-remove{font-size:.75rem; color:var(--danger); background:none; border:none; font-weight:700;}
  .cart-empty{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:.9rem;}
  .cart-foot{border-top:1px solid var(--line); padding:16px 20px 22px;}
  .cart-total-row{display:flex; justify-content:space-between; font-weight:800; margin-bottom:14px; font-size:1.02rem;}
  .cart-total-row span:last-child{color:var(--brass);}
  .checkout-btn{
    width:100%; padding:14px; border:none; border-radius:999px;
    background:var(--pine); color:var(--cream); font-weight:800; font-size:.94rem;
    transition:background .2s;
  }
  .checkout-btn:hover{background:var(--pine-x);}
  .checkout-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .cart-scrim{
    position:fixed; inset:0; background:rgba(10,20,15,.5); z-index:105;
    opacity:0; visibility:hidden; transition:opacity .25s;
  }
  .cart-scrim.open{opacity:1; visibility:visible;}

  /* ===================== فوتر ===================== */
  footer.site-footer{
    background:var(--pine-d); color:var(--cream);
    margin-top:40px; padding:34px 0 22px;
  }
  .footer-inner{display:flex; flex-wrap:wrap; gap:20px; justify-content:space-between; align-items:center;}
  .footer-inner p{margin:0; font-size:.82rem; color:#C9D6CD;}
  .admin-toggle{
    background:transparent; border:1px solid rgba(239,234,220,.3); color:var(--cream);
    padding:8px 16px; border-radius:999px; font-size:.78rem;
  }
  .admin-toggle:hover{border-color:var(--brass-l); color:var(--brass-l);}

  /* ===================== پنل مدیریت ===================== */
  #adminPanel{display:none; padding:36px 0; border-top:1px dashed var(--line);}
  .admin-box{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:24px; max-width:640px; margin:0 auto;
  }
  .admin-box h2{margin-top:0; font-size:1.1rem; color:var(--pine-d);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.8rem; font-weight:700; margin-bottom:6px; color:var(--ink-soft);}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:.88rem; background:var(--bg);
  }
  .field textarea{min-height:70px; resize:vertical;}
  .related-checks{display:flex; flex-wrap:wrap; gap:8px; max-height:130px; overflow-y:auto; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--bg);}
  .related-checks label{display:flex; align-items:center; gap:5px; font-size:.78rem; font-weight:500; background:var(--surface); padding:5px 9px; border-radius:8px; border:1px solid var(--line);}
  .img-preview{width:90px;height:90px;border-radius:12px;object-fit:cover;background:var(--cream); margin-top:8px; display:none;}
  .admin-save{
    padding:12px 26px; border:none; border-radius:999px; background:var(--brass); color:#2b2205;
    font-weight:800; font-size:.9rem; margin-top:6px;
  }
  .admin-list{margin-top:22px; border-top:1px solid var(--line); padding-top:16px;}
  .admin-list h3{font-size:.9rem; color:var(--ink-soft); margin-bottom:10px;}
  .admin-row{display:flex; align-items:center; gap:10px; font-size:.82rem; padding:6px 0; border-bottom:1px dashed var(--line);}
  .admin-row img{width:34px;height:34px;border-radius:8px;object-fit:cover;}
  .admin-row .grow{flex:1;}
  .admin-row button{background:none;border:none;color:var(--danger);font-size:.76rem;font-weight:700;}

  /* ===================== toast ===================== */
  #toast{
    position:fixed; bottom:22px; right:50%; transform:translateX(50%) translateY(20px);
    background:var(--pine-d); color:var(--cream);
    padding:12px 22px; border-radius:999px; font-size:.85rem; font-weight:600;
    box-shadow:var(--shadow-md);
    opacity:0; visibility:hidden; transition:all .3s ease;
    z-index:200;
    white-space:nowrap;
  }
  #toast.show{opacity:1; visibility:visible; transform:translateX(50%) translateY(0);}

  /* حالت موبایل */
  @media (max-width:640px){
    :root{--header-h:64px;}
    .brand span.tag{display:none;}
    .hero-slider{height:190px;}
    .section-head h2{font-size:1.12rem;}
    .modal-price{font-size:1.15rem;}
  }
</style>
</head>
<body>

<!-- ===================== هدر ثابت ===================== -->
<header class="site-header">
  <div class="container header-inner">
    <!-- لوگو سمت راست -->
    <a href="#top" class="brand">
      <img src="images/logo.png" alt="لوگوی فروشگاه بوتیک" width="40" height="40" />
      <span>
        بوتیک
        <span class="tag">فروشگاه اینترنتی</span>
      </span>
    </a>

    <!-- نوار جستجوی پیشرفته -->
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="جستجوی نام، دسته‌بندی یا توضیحات..." aria-label="جستجوی محصول" />
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <div id="searchResultsHint"></div>
    </div>

    <!-- آیکون سبد خرید سمت چپ -->
    <button class="cart-btn" id="cartOpenBtn" aria-label="مشاهده سبد خرید">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<a id="top"></a>

<!-- ===================== اسلایدر بنر ===================== -->
<section class="hero-slider" id="heroSlider" aria-roledescription="carousel" aria-label="بنرهای تبلیغاتی">
  <!-- اسلایدها با جاوااسکریپت پر می‌شوند -->
</section>

<main class="container">

  <!-- ===================== دسته‌بندی محصولات ===================== -->
  <section class="section" id="categoriesSection">
    <div class="section-head">
      <h2>دسته‌بندی محصولات</h2>
      <span class="sub">بر اساس دسته‌بندی فیلتر کنید</span>
    </div>
    <div class="cat-row" id="catRow"></div>
  </section>

  <!-- ===================== پرفروش‌ترین‌ها ===================== -->
  <section class="section" id="bestsellerSection">
    <div class="section-head">
      <h2>پرفروش‌ترین‌ها</h2>
      <span class="sub">با موس یا انگشت جابه‌جا کنید</span>
    </div>
    <div class="rail" id="bestsellerRail"></div>
  </section>

  <!-- ===================== همه محصولات ===================== -->
  <section class="section" id="allProductsSection">
    <div class="section-head">
      <h2 id="allProductsTitle">همه محصولات</h2>
      <span class="sub" id="resultCount"></span>
    </div>
    <div class="product-grid" id="allProductsGrid"></div>
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="btn-outline" id="loadMoreBtn">بارگذاری بیشتر</button>
    </div>
  </section>

</main>

<!-- ===================== فوتر ===================== -->

<!-- بوم مخفی برای تولید فاکتور -->
<canvas id="invoiceCanvas" style="display:none;"></canvas>

<script>
/* ==================================================================
   داده نمونه پشتیبان (در صورتی که fetch به products.json به دلیل
   اجرای فایل به‌صورت مستقیم (file://) با خطا مواجه شود از این آرایه
   استفاده می‌شود). محتوای آن دقیقاً برابر products.json است.
================================================================== */
const FALLBACK_PRODUCTS = [
  {"id":1,"name":"پیراهن کتان مردانه","price":450000,"category":"پوشاک","image":"images/1.png","description":"پیراهن کتان خالص با بافت سبک و مناسب فصل، دوخت اسلیم‌فیت و طیف رنگ خاکی. مناسب استفاده روزمره و نیمه‌رسمی.","related":[2,5,6],"bestseller":true},
  {"id":2,"name":"بلوز زنانه ساده","price":320000,"category":"پوشاک","image":"images/2.png","description":"بلوز یقه گرد از پارچه ویسکوز نرم با ریزش عالی، مناسب ست کردن با شلوار جین یا دامن.","related":[1,5,6],"bestseller":false},
  {"id":3,"name":"کیف چرم دستی","price":890000,"category":"کیف و کفش","image":"images/3.png","description":"کیف دستی چرم طبیعی با دوخت دستی و جای‌گذاری داخلی چندکاره، مناسب استفاده روزانه.","related":[4,5],"bestseller":true},
  {"id":4,"name":"کفش اسپرت طبی","price":1250000,"category":"کیف و کفش","image":"images/4.png","description":"کفش اسپرت با کفی طبی حافظه‌دار و رویه تنفس‌پذیر، مناسب پیاده‌روی طولانی.","related":[3,6],"bestseller":false},
  {"id":5,"name":"ساعت مچی کلاسیک","price":670000,"category":"اکسسوری","image":"images/5.png","description":"ساعت مچی با بدنه استیل ضدزنگ و صفحه‌نمایش آنالوگ، طراحی کلاسیک برای استفاده روزمره.","related":[6,1,2],"bestseller":true},
  {"id":6,"name":"عینک آفتابی","price":280000,"category":"اکسسوری","image":"images/6.png","description":"عینک آفتابی با پوشش ضد UV400 و فریم سبک پلاستیکی، مناسب استفاده در فصل تابستان.","related":[5,1,2],"bestseller":false},
  {"id":7,"name":"سرویس چای‌خوری","price":540000,"category":"خانه و آشپزخانه","image":"images/7.png","description":"سرویس چای‌خوری ۶ نفره از جنس چینی درجه‌یک با طرح ساده و مینیمال.","related":[8],"bestseller":true},
  {"id":8,"name":"گلدان سرامیکی","price":190000,"category":"خانه و آشپزخانه","image":"images/8.png","description":"گلدان سرامیکی دست‌ساز با پرداخت مات، مناسب گیاهان آپارتمانی کوچک.","related":[7],"bestseller":false}
];

const BANNERS = ["images/b1.png", "images/b2.png", "images/b3.png"];
const RUBIKA_URL = "https://rubika.ir/mehdiiranivip";
const ADMIN_STORAGE_KEY = "shop_admin_products_v1";
const CART_STORAGE_KEY = "shop_cart_v1";

/* ---------------------- وضعیت کلی برنامه ---------------------- */
let PRODUCTS = [];          // همه محصولات (بارگذاری‌شده + مدیریتی)
let cart = loadCart();      // [{id, qty}]
let activeCategory = "همه";
let searchTerm = "";
let visibleCount = 8;       // تعداد محصولات نمایش داده شده در گرید «همه محصولات»
const PAGE_SIZE = 8;

/* ==================================================================
   ابزارهای کمکی
================================================================== */
function formatPrice(n){
  return n.toLocaleString('fa-IR') + ' تومان';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function findProduct(id){
  return PRODUCTS.find(p => p.id === id);
}
function loadCart(){
  try{
    const raw = localStorage.getItem(CART_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCart(){
  localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
}
function loadAdminProducts(){
  try{
    const raw = localStorage.getItem(ADMIN_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveAdminProducts(list){
  localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(list));
}

/* ==================================================================
   بارگذاری اولیه داده‌ها
================================================================== */
async function loadProducts(){
  let base = FALLBACK_PRODUCTS;
  try{
    const res = await fetch('products.json', {cache:'no-store'});
    if(res.ok){
      base = await res.json();
    }
  }catch(e){
    // اجرای مستقیم از file:// معمولاً fetch را مسدود می‌کند؛
    // در این حالت از داده پشتیبان استفاده می‌شود.
    console.warn('products.json قابل بارگذاری نبود، از داده پشتیبان استفاده شد.', e);
  }
  const adminExtra = loadAdminProducts();
  PRODUCTS = [...base, ...adminExtra];
}

/* ==================================================================
   اسلایدر بنر خودکار (چرخش هر ۲ ثانیه با افکت محو شدن)
================================================================== */
function initHeroSlider(){
  const wrap = document.getElementById('heroSlider');
  wrap.innerHTML = '';
  const dots = document.createElement('div');
  dots.className = 'hero-dots';

  BANNERS.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i===0 ? ' active' : '');
    slide.innerHTML = `<img src="${src}" alt="بنر تبلیغاتی ${i+1}" loading="${i===0?'eager':'lazy'}" />`;
    wrap.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = i===0 ? 'active' : '';
    dot.setAttribute('aria-label', `نمایش بنر ${i+1}`);
    dot.addEventListener('click', ()=> goToSlide(i));
    dots.appendChild(dot);
  });
  wrap.appendChild(dots);

  let current = 0;
  let timer = null;

  function goToSlide(i){
    const slides = wrap.querySelectorAll('.hero-slide');
    const dotEls = wrap.querySelectorAll('.hero-dots button');
    slides[current].classList.remove('active');
    dotEls[current].classList.remove('active');
    current = i;
    slides[current].classList.add('active');
    dotEls[current].classList.add('active');
  }
  function next(){ goToSlide((current+1) % BANNERS.length); }

  function start(){ timer = setInterval(next, 2000); }
  function stop(){ clearInterval(timer); }

  start();
  wrap.addEventListener('mouseenter', stop);
  wrap.addEventListener('mouseleave', start);
  wrap.addEventListener('touchstart', stop, {passive:true});
  wrap.addEventListener('touchend', start, {passive:true});
}

/* ==================================================================
   دسته‌بندی‌ها
================================================================== */
function getCategories(){
  return ["همه", ...new Set(PRODUCTS.map(p => p.category))];
}
function renderCategories(){
  const row = document.getElementById('catRow');
  row.innerHTML = '';
  getCategories().forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      activeCategory = cat;
      visibleCount = PAGE_SIZE;
      renderCategories();
      renderAllProducts();
    });
    row.appendChild(btn);
  });
}

/* ==================================================================
   کارت محصول (قابل استفاده در چند بخش)
================================================================== */
function createProductCard(p){
  const card = document.createElement('article');
  card.className = 'product-card';

  const thumb = document.createElement('div');
  thumb.className = 'product-thumb';
  thumb.innerHTML = `<img src="${p.image}" alt="${p.name}" loading="lazy" />`;
  if(p.bestseller){
    const ribbon = document.createElement('span');
    ribbon.className = 'badge-ribbon';
    ribbon.textContent = 'پرفروش';
    thumb.appendChild(ribbon);
  }
  thumb.addEventListener('click', () => openProductModal(p.id));

  const body = document.createElement('div');
  body.className = 'product-body';
  body.innerHTML = `
    <span class="product-cat">${p.category}</span>
    <h3 class="product-name">${p.name}</h3>
    <div class="product-foot">
      <span class="price-chip">${formatPrice(p.price)}</span>
      <button class="add-btn" aria-label="افزودن به سبد خرید" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  `;
  body.querySelector('.product-name').addEventListener('click', () => openProductModal(p.id));

  const addBtn = body.querySelector('.add-btn');
  addBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    addToCart(p.id, 1);
    spawnRipple(addBtn, e);
    toast(`«${p.name}» به سبد خرید افزوده شد`);
  });

  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

function spawnRipple(btn, evt){
  const circle = document.createElement('span');
  circle.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  circle.style.width = circle.style.height = rect.width + 'px';
  circle.style.left = '0px';
  circle.style.top = '0px';
  btn.appendChild(circle);
  setTimeout(()=>circle.remove(), 600);
}

/* ==================================================================
   بخش پرفروش‌ترین‌ها + اسکرول لمسی/موس
================================================================== */
function renderBestsellers(){
  const rail = document.getElementById('bestsellerRail');
  rail.innerHTML = '';
  const list = PRODUCTS.filter(p => p.bestseller);
  const section = document.getElementById('bestsellerSection');
  section.style.display = list.length ? '' : 'none';
  list.forEach(p => rail.appendChild(createProductCard(p)));
  enableDragScroll(rail);
}

function enableDragScroll(el){
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', (e) => {
    isDown = true;
    el.classList.add('dragging');
    startX = e.pageX;
    scrollLeft = el.scrollLeft;
  });
  window.addEventListener('mouseup', () => { isDown=false; el.classList.remove('dragging'); });
  window.addEventListener('mousemove', (e) => {
    if(!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    el.scrollLeft = scrollLeft - dx;
  });
  // تاچ به‌صورت پیش‌فرض توسط مرورگر با overflow-x:auto پشتیبانی می‌شود
}

/* ==================================================================
   بخش «همه محصولات» + جستجو + فیلتر + بارگذاری تدریجی
================================================================== */
function getFilteredProducts(){
  return PRODUCTS.filter(p => {
    const matchCat = activeCategory === "همه" || p.category === activeCategory;
    const q = searchTerm.trim();
    const matchSearch = !q || [p.name, p.category, p.description].some(f => f && f.includes(q));
    return matchCat && matchSearch;
  });
}

function renderAllProducts(){
  const grid = document.getElementById('allProductsGrid');
  const list = getFilteredProducts();
  const shown = list.slice(0, visibleCount);

  grid.innerHTML = '';
  if(shown.length === 0){
    grid.innerHTML = `<p style="grid-column:1/-1;color:var(--ink-soft);text-align:center;padding:30px 0;">محصولی با این مشخصات پیدا نشد.</p>`;
  }else{
    shown.forEach(p => grid.appendChild(createProductCard(p)));
  }

  document.getElementById('resultCount').textContent = `${list.length.toLocaleString('fa-IR')} محصول`;
  document.getElementById('loadMoreWrap').style.display = visibleCount < list.length ? 'flex' : 'none';

  const hint = document.getElementById('searchResultsHint');
  if(searchTerm.trim()){
    hint.style.display = 'block';
    hint.textContent = `${list.length.toLocaleString('fa-IR')} نتیجه برای «${searchTerm}»`;
  }else{
    hint.style.display = 'none';
  }
}

document.getElementById('loadMoreBtn').addEventListener('click', () => {
  visibleCount += PAGE_SIZE;
  renderAllProducts();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  visibleCount = PAGE_SIZE;
  renderAllProducts();
});

/* ==================================================================
   مودال جزئیات محصول + محصولات مرتبط
================================================================== */
const overlay = document.getElementById('productOverlay');
const modalGrid = document.getElementById('modalGrid');
let modalQty = 1;

function openProductModal(id){
  const p = findProduct(id);
  if(!p) return;
  modalQty = 1;

  const related = (p.related || [])
    .map(rid => findProduct(rid))
    .filter(Boolean)
    .slice(0, 4);

  modalGrid.innerHTML = `
    <div class="modal-img"><img src="${p.image}" alt="${p.name}" /></div>
    <div class="modal-info">
      <span class="product-cat">${p.category}</span>
      <h3>${p.name}</h3>
      <div class="modal-price">${formatPrice(p.price)}</div>
      <p class="modal-desc">${p.description || ''}</p>
      <div class="qty-row">
        <div class="qty-control">
          <button type="button" id="modalMinus" aria-label="کاهش تعداد">−</button>
          <span id="modalQtyVal">1</span>
          <button type="button" id="modalPlus" aria-label="افزایش تعداد">+</button>
        </div>
        <button class="modal-add" id="modalAddBtn" type="button">افزودن به سبد خرید</button>
      </div>
    </div>
  `;

  const relatedWrap = document.createElement('div');
  relatedWrap.className = 'related-wrap';
  relatedWrap.style.gridColumn = '1 / -1';
  if(related.length){
    relatedWrap.innerHTML = `<h4>محصولات مرتبط</h4>`;
    const rg = document.createElement('div');
    rg.className = 'related-grid';
    related.forEach(rp => rg.appendChild(createProductCard(rp)));
    relatedWrap.appendChild(rg);
  }
  modalGrid.appendChild(relatedWrap);

  document.getElementById('modalMinus').addEventListener('click', () => {
    modalQty = Math.max(1, modalQty - 1);
    document.getElementById('modalQtyVal').textContent = modalQty.toLocaleString('fa-IR');
  });
  document.getElementById('modalPlus').addEventListener('click', () => {
    modalQty += 1;
    document.getElementById('modalQtyVal').textContent = modalQty.toLocaleString('fa-IR');
  });
  document.getElementById('modalAddBtn').addEventListener('click', (e) => {
    addToCart(p.id, modalQty);
    spawnRipple(e.currentTarget, e);
    toast(`${modalQty.toLocaleString('fa-IR')} عدد «${p.name}» به سبد خرید افزوده شد`);
  });

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape'){ closeModal(); closeCart(); } });

/* ==================================================================
   سبد خرید
================================================================== */
function addToCart(id, qty){
  const existing = cart.find(c => c.id === id);
  if(existing){ existing.qty += qty; }
  else{ cart.push({id, qty}); }
  saveCart();
  renderCartBadge();
  renderCartItems();
}
function updateQty(id, delta){
  const item = cart.find(c => c.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    cart = cart.filter(c => c.id !== id);
  }
  saveCart();
  renderCartBadge();
  renderCartItems();
}
function removeFromCart(id){
  cart = cart.filter(c => c.id !== id);
  saveCart();
  renderCartBadge();
  renderCartItems();
}
function cartTotal(){
  return cart.reduce((sum, c) => {
    const p = findProduct(c.id);
    return sum + (p ? p.price * c.qty : 0);
  }, 0);
}
function renderCartBadge(){
  const count = cart.reduce((s,c)=>s+c.qty, 0);
  document.getElementById('cartBadge').textContent = count.toLocaleString('fa-IR');
}
function renderCartItems(){
  const wrap = document.getElementById('cartItemsWrap');
  wrap.innerHTML = '';
  if(cart.length === 0){
    wrap.innerHTML = `<div class="cart-empty">سبد خرید شما خالی است.</div>`;
  }else{
    cart.forEach(c => {
      const p = findProduct(c.id);
      if(!p) return;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <img src="${p.image}" alt="${p.name}" loading="lazy" />
        <div class="cart-item-info">
          <p class="name">${p.name}</p>
          <span class="price">${formatPrice(p.price)}</span>
          <div class="cart-item-actions">
            <div class="qty-control">
              <button type="button" data-act="minus" aria-label="کاهش">−</button>
              <span>${c.qty.toLocaleString('fa-IR')}</span>
              <button type="button" data-act="plus" aria-label="افزایش">+</button>
            </div>
            <button class="cart-remove" data-act="remove">حذف</button>
          </div>
        </div>
      `;
      row.querySelector('[data-act=minus]').addEventListener('click', () => updateQty(c.id, -1));
      row.querySelector('[data-act=plus]').addEventListener('click', () => updateQty(c.id, 1));
      row.querySelector('[data-act=remove]').addEventListener('click', () => removeFromCart(c.id));
      wrap.appendChild(row);
    });
  }
  document.getElementById('cartTotal').textContent = formatPrice(cartTotal());
  document.getElementById('checkoutBtn').disabled = cart.length === 0;
}

const cartDrawer = document.getElementById('cartDrawer');
const cartScrim = document.getElementById('cartScrim');
function openCart(){
  cartDrawer.classList.add('open');
  cartScrim.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart(){
  cartDrawer.classList.remove('open');
  cartScrim.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('cartOpenBtn').addEventListener('click', openCart);
document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
cartScrim.addEventListener('click', closeCart);

/* ==================================================================
   فرآیند تسویه حساب: تولید فاکتور روی قالب f.png
================================================================== */
document.getElementById('checkoutBtn').addEventListener('click', generateInvoiceAndSend);

async function generateInvoiceAndSend(){
  if(cart.length === 0) return;

  const canvas = document.getElementById('invoiceCanvas');
  const bg = new Image();
  bg.src = 'images/f.png';
  await new Promise((resolve) => {
    bg.onload = resolve;
    bg.onerror = resolve; // حتی اگر تصویر پس‌زمینه بارگذاری نشد، ادامه بده
  });

  const W = bg.naturalWidth || 1240;
  const H = bg.naturalHeight || 1754;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);
  if(bg.naturalWidth){ ctx.drawImage(bg, 0, 0, W, H); }

  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#17211A';
  ctx.font = '600 26px Vazirmatn, Tahoma, sans-serif';

  const marginR = W - 70;
  let y = 240;
  const now = new Date();
  ctx.fillText('تاریخ: ' + now.toLocaleDateString('fa-IR'), marginR, y);
  y += 50;

  ctx.font = '700 24px Vazirmatn, Tahoma, sans-serif';
  ctx.fillText('نام محصول', marginR, y);
  ctx.fillText('قیمت واحد', marginR - 420, y);
  ctx.fillText('تعداد', marginR - 620, y);
  ctx.fillText('قیمت کل', marginR - 760, y);
  y += 16;
  ctx.strokeStyle = '#E4E2D8';
  ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(W-60,y); ctx.stroke();
  y += 36;

  ctx.font = '400 22px Vazirmatn, Tahoma, sans-serif';
  cart.forEach(c => {
    const p = findProduct(c.id);
    if(!p) return;
    const lineTotal = p.price * c.qty;
    ctx.fillText(p.name, marginR, y);
    ctx.fillText(p.price.toLocaleString('fa-IR'), marginR - 420, y);
    ctx.fillText(String(c.qty).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]), marginR - 620, y);
    ctx.fillText(lineTotal.toLocaleString('fa-IR'), marginR - 760, y);
    y += 42;
  });

  y += 20;
  ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(W-60,y); ctx.stroke();
  y += 46;
  ctx.font = '800 28px Vazirmatn, Tahoma, sans-serif';
  ctx.fillStyle = '#C98F2B';
  ctx.fillText('جمع کل: ' + formatPrice(cartTotal()), marginR, y);

  // دانلود تصویر فاکتور برای مشتری
  const dataUrl = canvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.href = dataUrl;
  link.download = 'invoice.png';
  link.click();

  // متن خلاصه سفارش برای ارسال در روبیکا
  const lines = cart.map(c => {
    const p = findProduct(c.id);
    return p ? `${p.name} × ${c.qty.toLocaleString('fa-IR')} — ${formatPrice(p.price * c.qty)}` : '';
  }).filter(Boolean);
  const summary = `سفارش جدید:\n${lines.join('\n')}\n\nجمع کل: ${formatPrice(cartTotal())}`;

  try{
    await navigator.clipboard.writeText(summary);
    toast('فاکتور دانلود شد و خلاصه سفارش کپی شد؛ در حال باز شدن روبیکا...');
  }catch(e){
    toast('فاکتور دانلود شد؛ در حال باز شدن روبیکا...');
  }

  // توجه: به دلایل امنیتی مرورگر (CORS)، ارسال خودکار پیام به یک
  // پلتفرم خارجی از سمت کلاینت ممکن نیست؛ لذا صفحه روبیکا باز می‌شود
  // تا کاربر خلاصه سفارش کپی‌شده را ارسال کند.
  setTimeout(() => {
    window.open(RUBIKA_URL, '_blank', 'noopener');
  }, 600);
}

/* ==================================================================
   پنل مدیریت محصولات
================================================================== */
document.getElementById('adminToggleBtn').addEventListener('click', () => {
  const panel = document.getElementById('adminPanel');
  const isOpen = panel.style.display === 'block';
  panel.style.display = isOpen ? 'none' : 'block';
  if(!isOpen){
    populateAdminHelpers();
    panel.scrollIntoView({behavior:'smooth', block:'start'});
  }
});

function populateAdminHelpers(){
  // دیتالیست دسته‌بندی‌ها
  const catList = document.getElementById('catList');
  catList.innerHTML = '';
  [...new Set(PRODUCTS.map(p=>p.category))].forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    catList.appendChild(opt);
  });

  // چک‌باکس‌های محصولات مرتبط
  const relWrap = document.getElementById('relatedChecks');
  relWrap.innerHTML = '';
  PRODUCTS.forEach(p => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" value="${p.id}" /> ${p.name}`;
    relWrap.appendChild(label);
  });

  renderAdminList();
}

let uploadedImageDataUrl = null;
document.getElementById('f-img').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    uploadedImageDataUrl = ev.target.result;
    const preview = document.getElementById('imgPreview');
    preview.src = uploadedImageDataUrl;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

document.getElementById('adminForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const price = Number(document.getElementById('f-price').value);
  const category = document.getElementById('f-cat').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  const relatedIds = [...document.querySelectorAll('#relatedChecks input:checked')].map(i => Number(i.value));

  if(!name || !price || !category){
    toast('لطفاً فیلدهای الزامی را کامل کنید.');
    return;
  }

  const newId = PRODUCTS.length ? Math.max(...PRODUCTS.map(p=>p.id)) + 1 : 1;
  const newProduct = {
    id: newId,
    name, price, category, description,
    image: uploadedImageDataUrl || 'images/1.png',
    related: relatedIds,
    bestseller: false
  };

  PRODUCTS.push(newProduct);
  const adminList = loadAdminProducts();
  adminList.push(newProduct);
  saveAdminProducts(adminList);

  toast('محصول با موفقیت ذخیره شد (در localStorage).');
  e.target.reset();
  document.getElementById('imgPreview').style.display = 'none';
  uploadedImageDataUrl = null;

  renderCategories();
  renderBestsellers();
  renderAllProducts();
  populateAdminHelpers();
});

function renderAdminList(){
  const wrap = document.getElementById('adminAddedList');
  const list = loadAdminProducts();
  wrap.innerHTML = '';
  if(list.length === 0){
    wrap.innerHTML = `<p style="font-size:.8rem;color:var(--ink-soft);">هنوز محصولی از این مرورگر افزوده نشده است.</p>`;
    return;
  }
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'admin-row';
    row.innerHTML = `
      <img src="${p.image}" alt="${p.name}" />
      <span class="grow">${p.name} — ${formatPrice(p.price)}</span>
      <button type="button">حذف</button>
    `;
    row.querySelector('button').addEventListener('click', () => {
      const updated = loadAdminProducts().filter(x => x.id !== p.id);
      saveAdminProducts(updated);
      PRODUCTS = PRODUCTS.filter(x => x.id !== p.id);
      cart = cart.filter(c => c.id !== p.id);
      saveCart();
      renderCategories(); renderBestsellers(); renderAllProducts(); renderCartBadge(); renderCartItems();
      renderAdminList();
    });
    wrap.appendChild(row);
  });
}

/* ==================================================================
   راه‌اندازی اولیه برنامه
================================================================== */
(async function init(){
  await loadProducts();
  initHeroSlider();
  renderCategories();
  renderBestsellers();
  renderAllProducts();
  renderCartBadge();
  renderCartItems();
})();
</script>
